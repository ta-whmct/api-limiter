[project]
name = "api-limiter"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "ruff>=0.16.2",
]

[tool.ruff]
fix = true
unsafe-fixes = true
exclude = [".venv"]
include = ["app/**.py"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "D",
    "CPY",
    "COM"
]